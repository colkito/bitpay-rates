version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a freshly published version sit for a week before we take it, so a
    # compromised release is likely to be yanked before it reaches this repo.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Keep the history Conventional Commits-clean for release-please.
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
