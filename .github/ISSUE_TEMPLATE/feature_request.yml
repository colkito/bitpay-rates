name: Feature request
description: Suggest an idea for bitpay-rates
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This package is deliberately tiny: one function, **zero runtime
        dependencies**, and only `dist/` is published. Proposals that add a
        runtime dependency are very unlikely to be accepted.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the library do instead? Sketch the API if you can.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing and solve it in user code".
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not require a new runtime dependency.
        - label: I am willing to open a pull request for it.
