name: Release Please

# On every push to main, maintain a "release PR" that bumps the version and
# updates CHANGELOG.md from Conventional Commits. Merging that PR creates a
# DRAFT GitHub Release with auto-generated notes for human review; publishing
# the draft triggers npm-publish.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT/App token (RELEASE_PLEASE_TOKEN) lets the release PR trigger
          # CI; without it GitHub suppresses workflows on bot-authored PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
