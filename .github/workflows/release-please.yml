name: Release Please

# On every push to main, maintain a "release PR" that bumps the version and
# updates CHANGELOG.md from Conventional Commits. Merging that PR creates a
# DRAFT GitHub Release with auto-generated notes for human review; publishing
# the draft triggers npm-publish.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived GitHub App installation token (Option C). This runs
      # only if the App is configured: set the `RELEASE_PLEASE_APP_ID` variable
      # and the `RELEASE_PLEASE_APP_PRIVATE_KEY` secret. The token expires when
      # the job ends — no long-lived PAT to rotate.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: ${{ vars.RELEASE_PLEASE_APP_ID != '' }}
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # An App/PAT token lets the release PR trigger CI; without it GitHub
          # suppresses workflows on bot-authored PRs. Falls back gracefully:
          # App token (Option C) → RELEASE_PLEASE_TOKEN PAT → GITHUB_TOKEN.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
