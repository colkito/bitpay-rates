name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Active LTS, matching .nvmrc and the publish job: the artifact is
          # built and smoke-tested on the same Node that publishes it.
          node-version: 24
          cache: npm
      - run: npm ci
      # Exactly the command contributors and agents run locally, so CI can
      # never drift from it.
      - run: npm run verify
      - run: npm audit --audit-level=high
      # Every installed package still matches what the registry signed.
      - run: npm audit signatures
      # Types across every resolution mode. Kept out of `verify` and out of
      # devDependencies: it pulls 56 packages and needs network.
      # ESM-only: attw's node16-cjs cell still flags require(esm), which Node
      # 22.12+ supports. The esm-only profile keeps the resolutions that matter.
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only

  test:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    strategy:
      matrix:
        # 22 = maintenance LTS (>=22.12 for require(esm)), 24 = active LTS, 26 = current.
        # These names become the check names (`test (22)`, …) that branch
        # protection requires. Changing this list without updating the required
        # checks leaves one that can never report and blocks every PR.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
