name: Publish Node.js Package

# Deploys to npm only when a human publishes a GitHub Release (the release is
# created as a draft by release-please, so publishing it is the review gate).
# Authentication uses npm Trusted Publishing (OIDC) — no long-lived token.
# CI already validated the merged commit, so this job only builds a fresh
# artifact (via `prepublishOnly`) and publishes it.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/bitpay-rates
    permissions:
      contents: read
      id-token: write # required for npm provenance + trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          # Do not restore the Actions cache on a publish job (cache poisoning).
          package-manager-cache: false

      - run: npm ci

      - name: Verify package version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      # `prepublishOnly` builds dist/ before packing. No NODE_AUTH_TOKEN:
      # OIDC trusted publishing is used, with provenance attestation.
      # Node 24 ships npm >= 11.5.1 (required for trusted publishing).
      - run: npm publish --provenance --access public
